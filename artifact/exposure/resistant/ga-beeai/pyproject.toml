[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-beeai"
version = "1.0.0"
description = "Integrity analysis for BeeAI ask-permission gating (resistant case)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "beeai-framework>=0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ga-beeai = "ga_beeai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
