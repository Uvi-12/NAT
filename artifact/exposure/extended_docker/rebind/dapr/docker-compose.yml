# Dapr self-hosted workflow stack: app + daprd sidecar (shared netns) + placement + redis.
# App control HTTP on :5001. Bring up: docker compose up -d --build (wait ~30s).
services:
  redis:
    image: redis:7
  placement:
    image: daprio/dapr:1.14.4
    command: ["./placement", "-port", "50006"]
  app:
    build: .
    ports:
      - "5001:5001"
    depends_on:
      - redis
  app-dapr:
    image: daprio/daprd:1.14.4
    command: [
      "./daprd", "-app-id", "apf", "-app-port", "5001",
      "-dapr-grpc-port", "50001",
      "-placement-host-address", "placement:50006",
      "-resources-path", "/components"
    ]
    network_mode: "service:app"
    volumes:
      - ./components:/components
    depends_on:
      - app
      - placement
      - redis
