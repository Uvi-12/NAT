# APF / APF - REPLAY reproduction: Kestra OSS (#34)
# Pinned Postgres-backed Kestra standalone. REST API on :8080.
# Bring up:  docker compose up -d   (wait ~40s for :8080/health to be UP)
# Tear down: docker compose down -v
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: kestra
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 5s
      timeout: 5s
      retries: 20

  kestra:
    image: kestra/kestra:v0.21.5
    pull_policy: missing
    command: server standalone
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          repository:
            type: postgres
          queue:
            type: postgres
          storage:
            type: local
            local:
              basePath: /app/storage
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            username: kestra
            password: kestra
            driverClassName: org.postgresql.Driver
    volumes:
      - kestra-data:/app/storage

volumes:
  kestra-data:
