[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-semantic-kernel"
version = "1.0.0"
description = "Integrity analysis for Semantic Kernel process-state human-in-the-loop"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "semantic-kernel>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ga-sk = "ga_sk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
