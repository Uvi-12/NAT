# Documenso (L2-06) — official image + PostgreSQL.
# The harness seeds a document and performs the state-only forge directly on
# PostgreSQL (5432), then verifies the persisted status through the DB and the
# app's HTTP surface (3000).
name: apf-l2-documenso
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: documenso
      POSTGRES_PASSWORD: documenso
      POSTGRES_DB: documenso
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U documenso"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    image: documenso/documenso:v1.11.1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_WEBAPP_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: apf-test-secret-do-not-use
      NEXT_PRIVATE_ENCRYPTION_KEY: apf-test-encryption-key-do-not-use
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: apf-test-encryption-secondary-key
      NEXT_PRIVATE_DATABASE_URL: postgresql://documenso:documenso@db:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgresql://documenso:documenso@db:5432/documenso
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp
      NEXT_PRIVATE_SMTP_HOST: localhost
      NEXT_PRIVATE_SMTP_PORT: "2500"
      NEXT_PRIVATE_SMTP_FROM_NAME: APF
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: apf@example.com
