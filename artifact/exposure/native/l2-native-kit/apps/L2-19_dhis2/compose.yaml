# DHIS2 (L2-19) — official core image + PostGIS.
# DHIS2 data approval is persisted in the `dataapproval` table; a row there marks
# a dataset/period/org-unit as approved (locking/releasing the data). The harness
# forges that row directly in PostgreSQL (5432) and verifies via DHIS2.
#
# NOTE: a dataapproval needs existing metadata (an approval workflow, a period, an
# org unit). Point the db at the DHIS2 demo database (Sierra Leone) for metadata —
# see meta.yaml. With an empty DB the harness records INCONCLUSIVE (no workflow).
name: apf-l2-dhis2
services:
  db:
    image: postgis/postgis:13-3.3
    environment:
      POSTGRES_USER: dhis
      POSTGRES_PASSWORD: dhis
      POSTGRES_DB: dhis2
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhis"]
      interval: 5s
      timeout: 5s
      retries: 30
  web:
    image: dhis2/core:2.40.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      DHIS2_DATABASE_HOST: db
      DHIS2_DATABASE_NAME: dhis2
      DHIS2_DATABASE_USERNAME: dhis
      DHIS2_DATABASE_PASSWORD: dhis
    ports:
      - "8085:8080"
