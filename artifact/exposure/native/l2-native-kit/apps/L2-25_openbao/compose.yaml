# OpenBao (L2-25, control-group) — official image, dev server.
# Control Groups (a persisted-Authorizations approval gate) are a Vault Enterprise
# feature; the OSS OpenBao build does not ship them. The harness detects their
# absence and records INCONCLUSIVE rather than forcing a result.
name: apf-l2-openbao
services:
  openbao:
    image: openbao/openbao:2.1.0
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: ["server", "-dev"]
    ports:
      - "8200:8200"
