# LibreSign (L2-08, RESISTANT) — Nextcloud + the LibreSign app + PostgreSQL.
# LibreSign re-parses the PAdES signature from the PDF and verifies it against the
# signer certificate, so a state-only write to the persisted "signed" status does
# not make an unsigned/forged PDF validate. The harness enables the app, forges the
# persisted status, then calls LibreSign's own validation (which re-parses the PDF)
# and shows it is rejected.
name: apf-l2-libresign
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      POSTGRES_DB: nextcloud
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    image: nextcloud:28-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: apf-admin-pass
      NEXTCLOUD_TRUSTED_DOMAINS: 127.0.0.1
