# Dogtag PKI (L2-23) — the Dogtag CA plus its backing 389 Directory Server.
# A fully spawned CA (pkispawn) is heavy and environment-specific; on a host where
# the CA does not come up headlessly, the harness records INCONCLUSIVE while
# documenting the resistance it would exercise.
name: apf-l2-dogtag
services:
  ds:
    image: 389ds/dirsrv:latest
    environment:
      DS_DM_PASSWORD: apf-admin-password
      DS_SUFFIX_NAME: dc=apf,dc=test
    ports:
      - "3389:3389"
    healthcheck:
      test: ["CMD-SHELL", "dsctl localhost status || true"]
      interval: 10s
      timeout: 5s
      retries: 20
  pki:
    image: dogtagpki/pki:11.6
    depends_on:
      - ds
    command: ["sleep", "infinity"]   # the harness runs pkispawn/pki inside this container
    ports:
      - "8443:8443"
