[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-openai-agents"
version = "1.0.0"
description = "Integrity analysis for OpenAI Agents SDK tool-approval state"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai-agents>=0.17",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
ga-openai-agents = "ga_openai_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
